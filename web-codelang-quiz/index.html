<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages sirve el 404.html raiz en subrutas de la SPA (p. ej.
      // /web-codelang-quiz/quiz); ese fallback redirige aqui con la subruta en la
      // query (?/quiz) y este script la restaura en la barra de direcciones para
      // que la app la resuelva sin recargar.
      ;(function () {
        var busqueda = window.location.search
        if (busqueda.indexOf('?/') === 0) {
          var resta = busqueda.slice(2)
          var amp = resta.indexOf('&')
          if (amp !== -1) resta = resta.slice(0, amp) + '?' + resta.slice(amp + 1)
          window.history.replaceState(
            null,
            '',
            window.location.pathname.replace(/index\.html$/, '') + resta + window.location.hash,
          )
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Codelang Quiz: resuelve problemáticas de código y mide tu nivel. Categorizado por lenguaje, dificultad y tipo."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Codelang Quiz</title>
  </head>
  <body>
    <div id="app">
      <header class="nav">
        <div class="nav__inner">
          <a href="./" class="nav__brand" data-ruta="inicio">
            codelang<span class="nav__dot">quiz</span>
          </a>

          <button
            type="button"
            class="nav__toggle"
            id="nav-toggle"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="nav-enlaces"
          >
            <span class="nav__bar"></span>
            <span class="nav__bar"></span>
            <span class="nav__bar"></span>
          </button>

          <nav id="nav-enlaces" class="nav__links" aria-label="Principal">
            <a class="nav__link" data-ruta="inicio" href="./">Inicio</a>
            <a class="nav__link" data-ruta="resultados" href="./?/resultados">Resultados</a>
            <button
              type="button"
              class="nav__link nav__menu-info"
              id="menu-info"
              aria-haspopup="dialog"
              aria-expanded="false"
            >
              Información sobre tus datos
            </button>
          </nav>

          <div class="nav__aside">
            <button
              type="button"
              class="nav__info"
              id="nav-info"
              aria-label="Información sobre los datos guardados"
              aria-haspopup="dialog"
              aria-expanded="false"
            >
              ?
            </button>
          </div>
        </div>
      </header>

      <main id="cuerpo"></main>

      <footer class="footer" aria-label="Pie de pagina">
        <p class="footer__tagline mono-label">Resuelve. Aprende. Repite.</p>
        <p class="footer__copy">Codelang Quiz</p>
      </footer>
    </div>

    <div id="captura" class="captura oculto"></div>
    <div id="modal-root" class="oculto"></div>

    <script src="./app.js"></script>
  </body>
</html>
