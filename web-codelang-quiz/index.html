<!doctype html>
<!-- Documento raíz: monta la app React en #root y carga las fuentes. -->
<html lang="es">
  <head>
    <!-- Metadatos básicos de SEO y comportamiento móvil. -->
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages sirve el 404.html raiz en subrutas de la SPA (p. ej.
      // /web-codelang-quiz/quiz); ese fallback redirige aqui con la subruta en la
      // query (?/quiz) y este script la restaura en la barra de direcciones para
      // que el router la resuelva sin recargar.
      ;(function () {
        var busqueda = window.location.search
        if (busqueda.indexOf('?/') === 0) {
          var resta = busqueda.slice(2)
          var amp = resta.indexOf('&')
          if (amp !== -1) resta = resta.slice(0, amp) + '?' + resta.slice(amp + 1)
          window.history.replaceState(
            null,
            '',
            window.location.pathname.replace(/index\.html$/, '') + resta + window.location.hash,
          )
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Codelang Quiz: resuelve problemáticas de código y mide tu nivel. Categorizado por lenguaje, dificultad y tipo." />
    <!-- Favicon SVG propio (logo de la marca). -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Fuentes Plus Jakarta Sans y JetBrains Mono desde Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Codelang Quiz</title>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <!-- Contenedor donde React renderiza la aplicación. -->
    <div id="root"></div>
  </body>
</html>
