    <title>exerciness</title>
    <script>
      ;(function () {
        // GitHub Pages sirve el 404.html raiz en subrutas de la SPA (p. ej.
        // /web-exerciness/ejercicios); ese fallback redirige aqui con la subruta
        // en la query (?/ejercicios) y este script la restaura en la barra de
        // direcciones para que el router la resuelva sin recargar.
        var busqueda = window.location.search
        if (busqueda.indexOf('?/') === 0) {
          var resta = busqueda.slice(2)
          var amp = resta.indexOf('&')
          if (amp !== -1) resta = resta.slice(0, amp) + '?' + resta.slice(amp + 1)
          window.history.replaceState(
            null,
            '',
            window.location.pathname.replace(/index\.html$/, '') + resta + window.location.hash,
          )
        }
      })()
    </script>
    <script>
      ;(function () {
        // Aplica el tema persistido antes del primer render para evitar un flash.
        var stored = localStorage.getItem('exerciness-theme')
        var dark = stored
          ? JSON.parse(stored).state.theme === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
