<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>exerciness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Catálogo de ejercicios de gimnasio con búsqueda, filtros, favoritos y comparador."
    />
    <meta property="og:title" content="exerciness" />
    <meta
      property="og:description"
      content="Catálogo de ejercicios de gimnasio con búsqueda, filtros, favoritos y comparador."
    />
    <meta property="og:image" content="assets/og-image.png" />
    <meta property="og:type" content="website" />
    <script>
      // Apply persisted theme before first render
      var stored = localStorage.getItem('exerciness-theme')
      var dark = stored
        ? JSON.parse(stored).state.theme === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches
      if (dark) document.documentElement.classList.add('dark')
    </script>
    <link rel="stylesheet" href="assets/index-CUSTOMS.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
