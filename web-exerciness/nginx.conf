# Configuración de Nginx para la SPA. Sirve dist/ desde /usr/share/nginx/html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Media (imágenes y animaciones): no cambia, cache inmutable.
    location ~* ^/(images|videos)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Datos del catálogo: cambian en cada sync, cache media.
    location ^~ /data/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Assets con hash emitidos por Vite: cache inmutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback SPA: cualquier ruta no encontrada sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
