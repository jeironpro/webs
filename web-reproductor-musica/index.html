<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reproductor de Música</title>
        <link rel="icon" href="assets/images/reproductor_musica.png" />
        <link rel="stylesheet" href="css/styles.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    </head>
    <body>
        <main>
            <div id="player-container">
                <span class="material-icons back">arrow_back</span>
                <div id="player">
                    <div class="playlist-icon-container">
                        <img
                            src="assets/images/lista_reproduccion.png"
                            alt="LISTADO"
                            class="playlist-icon"
                        />
                    </div>
                    <div class="song-container">
                        <img src="assets/images/musica.png" alt="CANCION" id="song-image" />
                    </div>
                    <div class="song-info">
                        <div id="artist-name"></div>
                        <div id="song-title"></div>
                    </div>
                    <div class="progress-bar">
                        <input
                            type="range"
                            id="progress"
                            min="0"
                            max="100"
                            value="0"
                            aria-label="Progreso de la canción"
                        />
                    </div>
                    <div class="controls-container">
                        <span class="material-icons" id="previous">skip_previous</span>
                        <div class="play-pause-container">
                            <span class="material-icons" id="play">play_arrow</span>
                            <span class="material-icons" id="pausar" style="display: none"
                                >pause</span
                            >
                        </div>
                        <span class="material-icons" id="next">skip_next</span>
                    </div>
                </div>
                <div id="song-list">
                    <!-- Dinámico -->
                </div>
            </div>
        </main>
        <script src="js/app.js"></script>
    </body>
</html>
