<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <meta
            name="description"
            content="Indicador del porcentaje del año transcurrido, con días restantes y progreso diario."
        />
        <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
        <title>Porcentaje del año · Progreso anual</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./css/tokens.css" />
        <link rel="stylesheet" href="./css/styles.css" />
    </head>
    <body class="page">
        <main class="main">
            <article class="year-card" aria-labelledby="year-card-title">
                <header class="year-card__header">
                    <div class="year-card__info">
                        <h1 id="year-card-title" class="year-card__title">
                            Año <span id="current-year-text"></span>
                        </h1>
                        <span class="year-card__subtitle">Progreso Anual</span>
                    </div>
                    <div class="year-card__badge">
                        <span id="remaining-days">0</span> días restantes
                    </div>
                </header>

                <div class="year-card__body">
                    <div id="days-grid" class="days" aria-hidden="true"></div>
                </div>

                <footer class="year-card__footer">
                    <div class="stats">
                        <div class="stats__row">
                            <span class="stats__label">Completado</span>
                            <div class="stats__percentage">
                                <span id="percentage-value" class="stats__value">0</span>
                                <span class="stats__symbol">%</span>
                            </div>
                        </div>
                        <div class="stats__progress">
                            <progress
                                id="progress"
                                class="progress"
                                max="100"
                                value="0"
                                aria-label="Porcentaje del año completado"
                            ></progress>
                        </div>
                    </div>
                </footer>
            </article>
        </main>
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
