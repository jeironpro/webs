<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="assets/icons/porcentaje.png" type="image/x-icon" />
        <title>Porcentaje Del Año</title>
        <link rel="stylesheet" href="css/styles.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Internal:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <main>
            <div class="main-container">
                <header class="card-header">
                    <div class="header-info">
                        <h1 class="title">Año <span id="current-year-text"></span></h1>
                        <span class="subtitle">Progreso Anual</span>
                    </div>
                    <div class="days-badge"><span id="remaining-days">0</span> días restantes</div>
                </header>

                <div class="card-body">
                    <div id="days-grid" class="days-grid">
                        <!-- Los puntos se generarán con JavaScript -->
                    </div>
                </div>

                <footer class="card-footer">
                    <div class="stats-container">
                        <div class="stat-row">
                            <span class="stat-label">Completado</span>
                            <div class="percentage-indicator">
                                <span id="percentage-value">0</span
                                ><span class="percentage-symbol">%</span>
                            </div>
                        </div>
                        <div class="progress-row">
                            <div class="bar-container">
                                <div id="progress-bar" class="progress-bar"></div>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </main>
        <script src="js/script.js"></script>
    </body>
</html>
