<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232b6cb0'><path d='M4 4h16v16H4V4zm2 2v12h12V6l-6 4-6-4z'/></svg>"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
        <link rel="stylesheet" href="css/react.css" />
        <link rel="stylesheet" href="styles.css" />
        <title>Generador de CV</title>
    </head>
    <body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-slate-100 text-slate-800 relative">
        <canvas id="particle-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

        <header class="sticky top-0 z-30 bg-white/70 backdrop-blur-xl border-b border-slate-200/60">
            <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div
                        class="w-9 h-9 rounded-xl bg-gradient-to-br from-navy-600 to-indigo-600 flex items-center justify-center shadow-md"
                    >
                        <svg
                            class="w-5 h-5 text-white"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                            aria-hidden="true"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M9 12h6m-3-3v6m-7 4h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                            />
                        </svg>
                    </div>
                    <span class="font-bold text-slate-800">CV Generator</span>
                </div>
                <div id="step-indicator" class="flex items-center gap-2 lg:hidden"></div>
            </div>
        </header>

        <div class="max-w-6xl mx-auto px-6 py-8">
            <div class="flex gap-8">
                <aside id="step-wizard" class="hidden lg:flex flex-col gap-3 w-56 shrink-0"></aside>
                <div id="step-content" class="flex-1 min-w-0"></div>
            </div>
        </div>

        <footer class="text-center py-8 text-xs text-slate-400">Hecho con HTML + CSS + JavaScript</footer>

        <script src="./vendor/jspdf.umd.min.js"></script>
        <script type="module" src="./app.js"></script>
    </body>
</html>
