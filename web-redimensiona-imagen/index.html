<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redimensionar Imagenes</title>
    <link rel="icon" href="icon/redimensionar_imagen.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
</head>
<body>
    <main>
        <div class="contenedor-principal">
            <h1>Redimensionar Imagen</h1>
            <div class="contenedor-entrada">
                <div class="zona-carga" id="zona-carga">
                    <img src="icon/carpeta.png" alt="SUBIR" class="icono-subida" />
                    <span class="texto-seleccion">Selecciona una imagen</span>
                    <img src="" alt="Previsualización" id="previsualizacion" class="previsualizacion" />
                </div>
            </div>
            <div class="controles-dimension">
                <div class="campo-ancho">
                    <span>ANCHO</span>
                    <input type="number" id="ancho" class="entrada-ancho" />
                </div>
                <div class="campo-largo">
                    <span>LARGO</span>
                    <input type="number" id="largo" class="entrada-largo" />
                </div>
            </div>
            <div class="contenedor-boton">
                <button id="boton-descargar">Descargar imagen</button>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
