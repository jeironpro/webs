<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <meta
            name="description"
            content="Redimensiona imágenes localmente en el navegador y descarga el resultado en PNG."
        />
        <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
        <title>Redimensionar imágenes</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./css/tokens.css" />
        <link rel="stylesheet" href="./css/styles.css" />
    </head>
    <body class="page">
        <main class="main">
            <section class="tool-card" aria-labelledby="tool-card-title">
                <h1 id="tool-card-title" class="tool-card__title">Redimensionar imagen</h1>

                <div class="upload">
                    <input
                        id="file-input"
                        class="file-input"
                        type="file"
                        accept="image/*"
                        aria-label="Seleccionar imagen"
                        aria-describedby="upload-hint"
                    />
                    <label id="drop-zone" class="drop-zone" for="file-input">
                        <svg
                            class="drop-zone__icon"
                            viewBox="0 0 64 64"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M32 40V12m0 0L20 24m12-12 12 12" />
                            <path d="M12 40v10a4 4 0 0 0 4 4h32a4 4 0 0 0 4-4V40" />
                        </svg>
                        <span class="drop-zone__text">Selecciona una imagen</span>
                        <span id="upload-hint" class="drop-zone__hint"> o arrástrala aquí </span>
                        <img
                            id="preview"
                            class="preview is-hidden"
                            alt="Previsualización de la imagen seleccionada"
                        />
                    </label>
                </div>

                <div class="dimensions">
                    <label class="field">
                        <span class="field__label">Ancho (px)</span>
                        <input
                            id="width"
                            class="field__input"
                            type="number"
                            min="1"
                            step="1"
                            inputmode="numeric"
                            placeholder="Original"
                        />
                    </label>
                    <label class="field">
                        <span class="field__label">Alto (px)</span>
                        <input
                            id="height"
                            class="field__input"
                            type="number"
                            min="1"
                            step="1"
                            inputmode="numeric"
                            placeholder="Original"
                        />
                    </label>
                </div>

                <p id="status" class="status" role="status" aria-live="polite"></p>

                <div class="actions">
                    <button id="download-button" class="actions__button" type="button">
                        Descargar imagen
                    </button>
                </div>
            </section>
        </main>
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
