<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Redimensionar Imagenes</title>
        <link rel="icon" href="assets/icons/redimensionar_imagen.png" />
        <link rel="stylesheet" href="css/styles.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <main>
            <div class="main-container">
                <h1>Redimensionar Imagen</h1>
                <div class="input-container">
                    <div class="drop-zone" id="drop-zone">
                        <img src="assets/icons/carpeta.png" alt="SUBIR" class="upload-icon" />
                        <span class="selection-text">Selecciona una imagen</span>
                        <img src="" alt="Previsualización" id="preview" class="preview" />
                    </div>
                </div>
                <div class="dimension-controls">
                    <div class="width-field">
                        <span>ANCHO</span>
                        <input
                            type="number"
                            id="width"
                            class="width-input"
                            aria-label="Ancho en píxeles"
                        />
                    </div>
                    <div class="height-field">
                        <span>LARGO</span>
                        <input
                            type="number"
                            id="height"
                            class="height-input"
                            aria-label="Largo en píxeles"
                        />
                    </div>
                </div>
                <div class="button-container">
                    <button id="download-button">Descargar imagen</button>
                </div>
            </div>
        </main>
        <script src="js/app.js"></script>
    </body>
</html>
