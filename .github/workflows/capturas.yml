name: capturas

# Bloquea la PR cuando una captura del catálogo es anterior a la página que
# muestra o falta. Las fechas y huellas salen de git y del manifiesto.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  desfase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Comprobar capturas
        run: node scripts/check-capturas.mjs
