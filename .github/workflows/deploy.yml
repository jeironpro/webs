name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Enable corepack
        run: corepack enable

      # La mayoría de proyectos son HTML/CSS/JS estático y se publican tal cual.
      # programmer-day importa Three.js desde node_modules, así que necesita build.
      - name: Build web-programmer-day
        working-directory: web-programmer-day
        run: |
          yarn install --immutable
          yarn build --base=./

      - name: Ensamblar sitio
        run: |
          mkdir -p site
          rsync -a --delete \
            --exclude .git \
            --exclude .github \
            --exclude .worktrees \
            --exclude site \
            --exclude node_modules \
            --exclude '*/node_modules' \
            --exclude '*/dist' \
            --exclude '*/.yarn' \
            --exclude '*/.pnp.cjs' \
            --exclude '*/.pnp.loader.mjs' \
            --exclude tests \
            ./ site/

          # programmer-day: build de Vite (index.html y assets compilados)
          rm -rf site/web-programmer-day/assets
          cp -r web-programmer-day/dist/. site/web-programmer-day/

          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # Sin esto se descarta el .nojekyll de la raíz y Pages procesaría el
          # sitio con Jekyll, que ignora las rutas que empiezan por "_".
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
