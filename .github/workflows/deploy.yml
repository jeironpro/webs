name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (yarn y pnpm)
        run: corepack enable

      # Las SPAs del monorepo se compilan en el despliegue: el repositorio
      # guarda la plantilla fuente (index.html -> /src/main.jsx) y el build
      # con base relativa genera dist/ para cada app.
      # VITE_BASE inyecta la subruta de cada app en el sitio publicado; los
      # assets del build quedan con rutas absolutas y los deep links resuelven
      # siempre. Si cambia el prefijo del hosting, basta editar esta linea.
      - name: Build web-exerciness
        run: |
          cd web-exerciness
          VITE_BASE=/webs/web-exerciness/ yarn install
          VITE_BASE=/webs/web-exerciness/ yarn build

      - name: Build web-codelang-quiz
        run: |
          cd web-codelang-quiz
          VITE_BASE=/webs/web-codelang-quiz/ yarn install
          VITE_BASE=/webs/web-codelang-quiz/ yarn build

      - name: Build web-pokemon
        run: |
          cd web-pokemon
          VITE_BASE=/webs/web-pokemon/ yarn install
          VITE_BASE=/webs/web-pokemon/ yarn build

      - name: Build web-naruto
        run: |
          cd web-naruto
          VITE_BASE=/webs/web-naruto/ pnpm install --frozen-lockfile
          VITE_BASE=/webs/web-naruto/ pnpm run build

      # Subproyectos Vite de los hubs web-juegos y web-dashboards: igual que
      # las SPAs, se compilan con --base para que assets y deep links resuelvan
      # en la subruta del sitio.
      - name: Build juego-4-rayas
        run: |
          cd web-juegos/juego-4-rayas
          yarn install && yarn build --base=/webs/web-juegos/juego-4-rayas/

      - name: Build juego-ajedrez
        run: |
          cd web-juegos/juego-ajedrez
          yarn install && yarn build --base=/webs/web-juegos/juego-ajedrez/

      - name: Build juego-damas
        run: |
          cd web-juegos/juego-damas
          yarn install && yarn build --base=/webs/web-juegos/juego-damas/

      - name: Build juego-puntos-cajas
        run: |
          cd web-juegos/juego-puntos-cajas
          yarn install && yarn build --base=/webs/web-juegos/juego-puntos-cajas/

      - name: Build juego-yatzy
        run: |
          cd web-juegos/juego-yatzy
          yarn install && yarn build --base=/webs/web-juegos/juego-yatzy/

      - name: Build dashboard-administrador
        run: |
          cd web-dashboards/dashboard-administrador
          yarn install && yarn build --base=/webs/web-dashboards/dashboard-administrador/

      - name: Build dashboard-financiero
        run: |
          cd web-dashboards/dashboard-financiero
          yarn install && yarn build --base=/webs/web-dashboards/dashboard-financiero/

      - name: Build dashboard-monitoreo
        run: |
          cd web-dashboards/dashboard-monitoreo
          yarn install && yarn build --base=/webs/web-dashboards/dashboard-monitoreo/

      - name: Build dashboard-operativo-analitico
        run: |
          cd web-dashboards/dashboard-operativo-analitico
          yarn install && yarn build --base=/webs/web-dashboards/dashboard-operativo-analitico/

      - name: Build dashboard-soporte
        run: |
          cd web-dashboards/dashboard-soporte
          yarn install && yarn build --base=/webs/web-dashboards/dashboard-soporte/

      - name: Build web-lenguajes-programacion (Sphinx)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir Sphinx de web-lenguajes-programacion
        run: |
          cd web-lenguajes-programacion
          pip install -r sphinx/requirements.txt
          python3 -m sphinx -b html material . -c sphinx -d .doctrees
      # Sitio final: catalogo raiz + todas las webs tal cual + dist/ de las
      # SPAs compiladas sobre su carpeta (sin publicar codigo fuente).
      - name: Ensamblar sitio
        run: |
          mkdir -p site
          rsync -a --delete \
            --exclude .git \
            --exclude .github \
            --exclude site \
            --exclude node_modules \
            --exclude '*/node_modules' \
            --exclude '*/dist' \
            --exclude '*/.yarn' \
            --exclude '*/.pnp.cjs' \
            --exclude '*/.pnp.loader.mjs' \
            --exclude tests \
            --exclude web-exerciness \
            --exclude web-codelang-quiz \
            --exclude web-pokemon \
            --exclude web-naruto \
            --exclude web-lenguajes-programacion \
            ./ site/
          rsync -a web-exerciness/dist/ site/web-exerciness/
          rsync -a web-codelang-quiz/dist/ site/web-codelang-quiz/
          rsync -a web-pokemon/dist/ site/web-pokemon/
          rsync -a web-naruto/dist/ site/web-naruto/
          # dist/ de los subproyectos Vite de los hubs sobre su carpeta
          rsync -a web-juegos/juego-4-rayas/dist/ site/web-juegos/juego-4-rayas/
          rsync -a web-juegos/juego-ajedrez/dist/ site/web-juegos/juego-ajedrez/
          rsync -a web-juegos/juego-damas/dist/ site/web-juegos/juego-damas/
          rsync -a web-juegos/juego-puntos-cajas/dist/ site/web-juegos/juego-puntos-cajas/
          rsync -a web-juegos/juego-yatzy/dist/ site/web-juegos/juego-yatzy/
          rsync -a web-dashboards/dashboard-administrador/dist/ site/web-dashboards/dashboard-administrador/
          rsync -a web-dashboards/dashboard-financiero/dist/ site/web-dashboards/dashboard-financiero/
          rsync -a web-dashboards/dashboard-monitoreo/dist/ site/web-dashboards/dashboard-monitoreo/
          rsync -a web-dashboards/dashboard-operativo-analitico/dist/ site/web-dashboards/dashboard-operativo-analitico/
          rsync -a web-dashboards/dashboard-soporte/dist/ site/web-dashboards/dashboard-soporte/
          # la web se construye en su propia raiz: publicar solo lo generado
          rsync -a \
            --exclude material \
            --exclude sphinx \
            --exclude .doctrees \
            --exclude JavaDAWITIC \
            --exclude PythonDCSINFOTEP \
            --exclude JavaScriptDCSINFOTEP \
            --exclude LICENSE \
            --exclude README.md \
            web-lenguajes-programacion/ site/web-lenguajes-programacion/
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
