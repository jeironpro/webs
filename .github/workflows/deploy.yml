name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (yarn y pnpm)
        run: corepack enable# Despliegue de sitio estático: cada proyecto usa su estrategia de build
      # Según su stack tecnológico. Los proyectos migrados a vanilla JS ya no
      # usan VITE_BASE inyección de subruta, su salida es JS/HTML/CSS puro.
      # - web-exerciness, web-programmer-day: build Vite vanilla JS (usa VITE_BASE si es necesario)
      # - web-clima: HTML/JS puro (copy directo de archivos)
      # - web-generador-cv: dist/ rsync (build previo)
      # - Hubs (juegos, dashboards): compilados por scripts/compila-hubs.mjs
      # - web-lenguajes-programacion: docs Sphinx
      # - Los demas proyectos tienen su build en package.json scripts
      - name: Ensamblar sitio
        run: |
          mkdir -p site
          rsync -a --delete \
            --exclude .git \
            --exclude .github \
            --exclude site \
            --exclude node_modules \
            --exclude '*/node_modules' \
            --exclude '*/dist' \
            --exclude '*/.yarn' \
            --exclude '*/.pnp.cjs' \
            --exclude '*/.pnp.loader.mjs' \
            --exclude tests \
            --exclude web-exerciness \
            --exclude web-programmer-day \
            --exclude web-clima \
            --exclude web-generador-cv \
            --exclude web-codelang-quiz \
            --exclude web-pokemon \
            --exclude web-naruto \
            --exclude web-lenguajes-programacion \
            ./ site/
          # Cada proyecto compila o se copia como corresponde:
          # cp -r web-exerciness/* site/web-exerciness/ 2>/dev/null || true
          # cp -r web-programmer-day/* site/web-programmer-day/ 2>/dev/null || true
          # web-clima: archivos estáticos puros
          rsync -a web-clima/ site/web-clima/ 2>/dev/null || true
          # web-generador-cv: dist/ generado previamente
          rsync -a web-generador-cv/dist/ site/web-generador-cv/
          # hubs y docs: compilados por scripts externos
          touch site/.nojekyll


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
