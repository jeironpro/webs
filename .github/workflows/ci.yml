name: ci

on:
  push:
    branches: [main]
    paths:
      - "projects.yml"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".editorconfig"
      - ".prettierignore"
      - ".prettierrc.json"
      - "eslint.config.js"
      - "vitest.config.mjs"
      - "css/**"
      - "js/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "projects.yml"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".editorconfig"
      - ".prettierignore"
      - ".prettierrc.json"
      - "eslint.config.js"
      - "vitest.config.mjs"
      - "css/**"
      - "js/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          # la fecha de assets/projects.json sale del último commit de projects.yml
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install
        run: |-
          if [ -f package.json ]; then \
            corepack enable \
            yarn install --frozen-lockfile; \
          fi

      - name: Format check
        run: |-
          if [ -f package.json ]; then \
            yarn format:check; \
          fi

      - name: Lint
        run: |-
          if [ -f package.json ]; then \
            yarn lint; \
          fi

      - name: Tests
        run: |-
          if [ -f package.json ]; then \
           cd \$(ls -d */ 2>/dev/null | head -1 | sed 's|/||') && yarn test 2>/dev/null || cd ..; \
            echo "Tests check finished\n"; \
          fi

      - name: Data build
        run: |-
          if [ -f package.json ]; then \
            yarn data:build; \
          fi

      - name: Data sincronizada
        run: git diff --exit-code assets/projects.json
