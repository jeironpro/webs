<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Paises visitados</title>
        <link rel="icon" type="image/png" sizes="32x32" href="assets/images/paises.png" />
        <link
            href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/styles.css" />
        <link rel="stylesheet" href="css/animacion.css" />
    </head>
    <body>
        <div id="plane-wrapper">
            <svg id="plane" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <polygon
                    points="32,2 4,62 32,50 60,62"
                    fill="white"
                    stroke="#444"
                    stroke-width="2"
                />
                <line x1="32" y1="2" x2="32" y2="50" stroke="#555" stroke-width="2" />
                <line x1="32" y1="50" x2="20" y2="35" stroke="#aaa" stroke-width="1" />
                <line x1="32" y1="50" x2="44" y2="35" stroke="#aaa" stroke-width="1" />
            </svg>
        </div>
        <header>
            <h1>Paises visitados</h1>
        </header>
        <main>
            <div class="filter-container">
                <input
                    type="search"
                    name="search"
                    id="search"
                    placeholder="buscar país"
                    autocomplete="off"
                    aria-label="Buscar país"
                />
            </div>
            <div id="countries-container"></div>
        </main>
        <footer>
            <p>Todos los derechos reservados - JeironPro <span data-year>2025</span></p>
        </footer>
        <script src="js/script.js"></script>
        <script src="js/animacion.js"></script>
        <script src="https://kit.fontawesome.com/25da21ab57.js" crossorigin="anonymous"></script>
        <script>
            document.querySelectorAll("[data-year]").forEach((node) => {
                node.textContent = new Date().getFullYear();
            });
        </script>
    </body>
</html>
