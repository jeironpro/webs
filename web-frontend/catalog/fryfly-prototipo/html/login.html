<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login</title>
        <link rel="icon" href="../assets/images/icons/logo.png" />
        <link rel="stylesheet" href="../css/login.css" />
        <link rel="stylesheet" href="../css/modal.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <main>
            <div class="contenedor-login">
                <span class="registro"><a href="registro.html">Registrarme</a></span>
                <div class="logo-titulo">
                    <h1>FryFly</h1>
                    <figure>
                        <img src="../assets/images/icons/logo.png" alt="LOGO" />
                    </figure>
                </div>
                <form>
                    <div class="control">
                        <label for="correoElectronico">Correo Electronico</label>
                        <input type="email" id="correoElectronico" />
                    </div>
                    <div class="control">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" />
                        <a href="#" id="open-recovery">Olvidaste tu contraseña?</a>
                        <button
                            type="button"
                            class="mostrar-ocultar"
                            id="toggle-password"
                            aria-label="Mostrar u ocultar contraseña"
                        >
                            <i class="fas fa-eye" id="icono-mostrar-ocultar"></i>
                        </button>
                    </div>
                    <div class="boton">
                        <button type="button" id="login-button">Entrar</button>
                    </div>
                </form>
                <div class="registro-sociales">
                    <div class="linea-izquierda"></div>
                    <span>Iniciar con</span>
                    <div class="linea-derecha"></div>
                </div>
                <div class="enlaces-registro">
                    <div class="enlace-google">
                        <i class="fab fa-google"></i>
                    </div>
                    <div class="enlace-facebook">
                        <i class="fab fa-facebook"></i>
                    </div>
                </div>
            </div>
            <div id="modalOlvCon" class="modalOlvCon">
                <div class="tituloModal">
                    <span>Olvidaste Tu Contraseña</span>
                </div>
                <div class="indicacionesModal">
                    <span
                        >Si has olvidado tu contraseña, escribe tu correo electronico para que
                        recibas instrucciones de como recuperarla.</span
                    >
                </div>
                <form class="formularioModal">
                    <div class="controlModal">
                        <label for="email">Correo Electronico</label>
                        <input type="email" id="email" />
                    </div>
                    <div class="botonesModal">
                        <button type="button" id="close-recovery" class="botonModal">
                            Regresar
                        </button>
                        <button type="button" id="recover-button" class="botonModal">
                            Verificar
                        </button>
                    </div>
                </form>
            </div>
            <div id="modalOlvConOverlay" class="modalOlvConOverlay"></div>
        </main>
        <script src="../js/login.js"></script>
        <script src="https://kit.fontawesome.com/25da21ab57.js" crossorigin="anonymous"></script>
    </body>
</html>
