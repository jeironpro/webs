<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Modal</title>
        <link rel="icon" href="icon/modal.png" />
        <link rel="stylesheet" href="css/styles.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <main>
            <div class="modal-container">
                <button id="open-modal" class="modal-open-button" type="button">Abrir Modal</button>
                <div id="modal" class="modal">
                    <div class="modal-title-bar">
                        <h1 class="modal-heading">Titulo Modal</h1>
                        <button
                            id="close-modal"
                            type="button"
                            class="modal-close-button"
                            aria-label="Cerrar modal"
                        >
                            &times;
                        </button>
                    </div>
                    <div id="contenido-modal" class="modal-content">
                        <div class="modal-text">Contenido</div>
                        <div class="modal-actions">
                            <button type="button" class="modal-button">Boton Modal</button>
                            <button type="button" class="modal-button">Boton Modal</button>
                        </div>
                    </div>
                </div>
                <div id="modal-overlay" class="modal-overlay"></div>
            </div>
        </main>
        <script src="js/script.js"></script>
    </body>
</html>
