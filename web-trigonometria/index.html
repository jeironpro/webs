<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Círculo trigonométrico · Órbita</title>
        <meta
            name="description"
            content="Explora el círculo unitario: arrastra el punto o mueve el ángulo y lee al instante seno, coseno, tangente, radianes y cuadrante."
        />
        <meta name="theme-color" content="#f2f4f8" />
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <a class="skip-link" href="#angle-range">Saltar al control del ángulo</a>

        <div class="frame">
            <header class="bar">
                <a class="brand" href="../">
                    <span class="brand__ring" aria-hidden="true"></span>
                    Órbita <span class="brand__slash">/</span> trigonometría
                </a>
                <nav class="bar__nav" aria-label="Principal">
                    <a class="bar__link" href="../">catálogo</a>
                    <a
                        class="bar__link"
                        href="https://github.com/jeironpro/webs/tree/main/web-trigonometria"
                        target="_blank"
                        rel="noopener noreferrer"
                        >github ↗</a
                    >
                </nav>
            </header>

            <main class="instrument">
                <h1 class="visually-hidden">Círculo trigonométrico interactivo</h1>

                <div class="readout readout--angle">
                    <span class="readout__label">Ángulo</span>
                    <output
                        class="readout__value readout__value--large"
                        id="angle-value"
                        aria-live="off"
                        >30°</output
                    >
                    <span class="readout__sub" id="angle-radians">0.524 rad</span>
                    <span class="readout__exact" id="angle-exact"></span>
                </div>

                <figure class="orbit">
                    <svg
                        class="orbit__svg"
                        id="orbit-svg"
                        viewBox="-1.3 -1.3 2.6 2.6"
                        aria-hidden="true"
                    >
                        <g class="orbit__grid">
                            <circle class="orbit__ring" cx="0" cy="0" r="0.75" />
                            <circle class="orbit__ring" cx="0" cy="0" r="0.5" />
                            <circle class="orbit__ring" cx="0" cy="0" r="0.25" />
                            <line class="orbit__axis" x1="-1.2" y1="0" x2="1.2" y2="0" />
                            <line class="orbit__axis" x1="0" y1="-1.2" x2="0" y2="1.2" />
                            <circle class="orbit__circle" cx="0" cy="0" r="1" />
                        </g>

                        <g class="orbit__tags">
                            <text x="1.04" y="0.11">0°</text>
                            <text x="0.05" y="-1.04">90°</text>
                            <text x="-1.04" y="0.11" text-anchor="end">180°</text>
                            <text x="0.05" y="1.14">270°</text>
                        </g>

                        <path class="orbit__arc" id="arc" d="" />
                        <line class="orbit__cos" id="cos-line" x1="0" y1="0" x2="1" y2="0" />
                        <line class="orbit__sin" id="sin-line" x1="1" y1="0" x2="1" y2="0" />
                        <line class="orbit__radius" id="radius" x1="0" y1="0" x2="1" y2="0" />
                        <circle class="orbit__point" id="point" cx="1" cy="0" r="0.05" />
                    </svg>
                    <figcaption class="visually-hidden">
                        Círculo unitario con el ángulo, sus proyecciones de seno y coseno y el punto
                        sobre la circunferencia.
                    </figcaption>
                </figure>

                <div class="readout readout--sin">
                    <span class="readout__label">seno</span>
                    <output class="readout__value" id="sin-value" aria-live="off">0.500</output>
                    <span class="readout__exact" id="sin-exact"></span>
                </div>

                <div class="readout readout--cos">
                    <span class="readout__label">coseno</span>
                    <output class="readout__value" id="cos-value" aria-live="off">0.866</output>
                    <span class="readout__exact" id="cos-exact"></span>
                </div>

                <div class="readout readout--tan">
                    <span class="readout__label">tangente</span>
                    <output class="readout__value" id="tan-value" aria-live="off">0.577</output>
                    <span class="readout__exact" id="tan-exact"></span>
                </div>

                <div class="readout readout--coords">
                    <span class="readout__label">punto</span>
                    <output
                        class="readout__value readout__value--small"
                        id="coords-value"
                        aria-live="off"
                        >(0.866, 0.500)</output
                    >
                    <span class="readout__exact" id="coords-exact"></span>
                </div>

                <p class="badge" id="quadrant">Cuadrante I</p>
            </main>

            <footer class="dock">
                <div class="dock__control">
                    <label class="dock__label" for="angle-range">Ángulo</label>
                    <input
                        class="slider"
                        id="angle-range"
                        name="angle-range"
                        type="range"
                        min="0"
                        max="360"
                        step="1"
                        value="30"
                    />
                    <span class="number">
                        <input
                            class="number__input"
                            id="angle-number"
                            name="angle-number"
                            type="number"
                            min="-360"
                            max="720"
                            step="1"
                            value="30"
                            aria-label="Ángulo en grados"
                        />
                        <span class="number__unit" aria-hidden="true">°</span>
                    </span>
                </div>

                <div class="presets" role="group" aria-label="Ángulos frecuentes">
                    <button class="preset" type="button" data-angle="0" aria-pressed="false">
                        0°
                    </button>
                    <button class="preset" type="button" data-angle="30" aria-pressed="true">
                        30°
                    </button>
                    <button class="preset" type="button" data-angle="45" aria-pressed="false">
                        45°
                    </button>
                    <button class="preset" type="button" data-angle="60" aria-pressed="false">
                        60°
                    </button>
                    <button class="preset" type="button" data-angle="90" aria-pressed="false">
                        90°
                    </button>
                    <button class="preset" type="button" data-angle="180" aria-pressed="false">
                        180°
                    </button>
                    <button class="preset" type="button" data-angle="270" aria-pressed="false">
                        270°
                    </button>
                </div>

                <p class="hint">
                    Arrastra el punto o mueve el deslizador; todo se recalcula en vivo.
                </p>
            </footer>
        </div>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
