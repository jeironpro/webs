<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Algoritmos · tarjetas para repasar</title>
        <meta
            name="description"
            content="Colección de algoritmos clásicos de búsqueda, ordenación, grafos y compresión explicados en tarjetas que se giran."
        />
        <link rel="shortcut icon" href="icon/algorithms.png" type="image/x-icon" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="header">
            <div class="header__content">
                <p class="header__eyebrow">colección</p>
                <h1 class="header__title">Algoritmos</h1>
                <p class="header__subtitle">
                    Búsqueda, ordenación, grafos y compresión en tarjetas. Pasa el cursor para
                    girarlas.
                </p>
            </div>
        </header>

        <main class="main">
            <section class="catalog" aria-label="Lista de algoritmos">
                <div class="cards" id="cards"></div>
            </section>
        </main>

        <footer class="footer">
            &copy; Todos los derechos reservados <span data-year>2025</span> - JeironPro
        </footer>

        <script src="js/cards.js"></script>
        <script>
            document.querySelectorAll("[data-year]").forEach((node) => {
                node.textContent = new Date().getFullYear();
            });
        </script>
    </body>
</html>
