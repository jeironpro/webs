<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Genera contraseñas seguras y aleatorias directamente en tu navegador."
        />
        <title>Generador de Contraseñas Seguras</title>
        <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/tokens.css" />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <main class="page">
            <section class="generator" aria-labelledby="generator-title">
                <header class="generator__header">
                    <h1 class="generator__title" id="generator-title">Generador de Contraseñas</h1>
                    <p class="generator__subtitle">
                        Crea contraseñas seguras y aleatorias al instante.
                    </p>
                </header>
                <div class="generator__result">
                    <input
                        type="text"
                        id="password-field"
                        class="generator__field"
                        aria-label="Contraseña generada"
                        readonly
                        placeholder="Tu contraseña aparecerá aquí"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                    />
                    <button id="generate-button" class="btn btn--primary" type="button">
                        Generar
                    </button>
                </div>
                <div
                    id="status-message"
                    class="generator__status"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                ></div>
            </section>
        </main>
        <script type="module" src="js/app.js"></script>
    </body>
</html>
