<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <meta
            name="description"
            content="Ruleta interactiva para sortear números o nombres configurados desde un panel lateral."
        />
        <title>Ruleta</title>
        <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./css/tokens.css" />
        <link rel="stylesheet" href="./css/style.css" />
    </head>
    <body class="page">
        <button
            id="sidebar-toggle"
            class="settings-toggle"
            type="button"
            aria-label="Abrir configuración"
            aria-controls="sidebar"
            aria-expanded="false"
        >
            <svg
                class="settings-toggle__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
            >
                <path d="M4 6h16M4 12h16M4 18h16" />
                <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none" />
                <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none" />
                <circle cx="7" cy="18" r="2" fill="currentColor" stroke="none" />
            </svg>
        </button>

        <aside
            id="sidebar"
            class="sidebar"
            aria-label="Panel de configuración"
            aria-hidden="true"
            inert
        >
            <div class="sidebar__header">
                <h2 class="sidebar__title">Configuración</h2>
                <button
                    id="sidebar-close"
                    class="sidebar__close"
                    type="button"
                    aria-label="Cerrar configuración"
                >
                    <svg
                        class="sidebar__close-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        aria-hidden="true"
                    >
                        <path d="M18 6 6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="sidebar__body">
                <div class="sidebar__tabs" role="tablist" aria-label="Modo de configuración">
                    <button
                        id="tab-numbers"
                        class="sidebar__tab"
                        type="button"
                        role="tab"
                        aria-selected="true"
                        aria-controls="numbers-panel"
                    >
                        <svg
                            class="sidebar__tab-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            aria-hidden="true"
                        >
                            <path d="M9 4 7 20M17 4l-2 16M4 9h16M3 15h16" />
                        </svg>
                        Números
                    </button>
                    <button
                        id="tab-names"
                        class="sidebar__tab"
                        type="button"
                        role="tab"
                        aria-selected="false"
                        aria-controls="names-panel"
                    >
                        <svg
                            class="sidebar__tab-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            aria-hidden="true"
                        >
                            <circle cx="12" cy="8" r="4" />
                            <path d="M4 21a8 8 0 0 1 16 0" />
                        </svg>
                        Nombres
                    </button>
                </div>

                <section
                    id="numbers-panel"
                    class="tab-panel"
                    role="tabpanel"
                    aria-labelledby="tab-numbers"
                    tabindex="0"
                >
                    <div class="field">
                        <label class="field__label" for="range-from">Desde</label>
                        <input
                            id="range-from"
                            class="field__input"
                            type="number"
                            value="1"
                            min="0"
                            max="999"
                        />
                    </div>
                    <div class="field">
                        <label class="field__label" for="range-to">Hasta</label>
                        <input
                            id="range-to"
                            class="field__input"
                            type="number"
                            value="10"
                            min="1"
                            max="1000"
                        />
                    </div>
                    <div class="field">
                        <span class="field__label">Opciones adicionales</span>
                        <label class="checkbox">
                            <input id="include-zero" class="checkbox__input" type="checkbox" />
                            <span class="checkbox__text">Incluir el 0</span>
                        </label>
                    </div>
                    <button
                        id="apply-numbers"
                        class="action action--primary action--full"
                        type="button"
                    >
                        Aplicar números
                    </button>
                </section>

                <section
                    id="names-panel"
                    class="tab-panel"
                    role="tabpanel"
                    aria-labelledby="tab-names"
                    tabindex="0"
                    hidden
                >
                    <div class="name-add">
                        <label class="visually-hidden" for="name-input">
                            Nombre que quieres añadir a la ruleta
                        </label>
                        <input
                            id="name-input"
                            class="field__input name-add__input"
                            type="text"
                            placeholder="Escribe un nombre..."
                        />
                        <button
                            id="add-name"
                            class="action action--primary action--icon"
                            type="button"
                            aria-label="Añadir nombre"
                        >
                            <svg
                                class="action__icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                aria-hidden="true"
                            >
                                <path d="M12 5v14M5 12h14" />
                            </svg>
                        </button>
                    </div>
                    <p class="name-add__hint">Presiona Enter o pulsa + para agregar</p>

                    <div id="name-list" class="name-list" aria-live="polite">
                        <p class="name-list__empty">No hay nombres agregados</p>
                    </div>

                    <button
                        id="apply-names"
                        class="action action--primary action--full"
                        type="button"
                    >
                        Aplicar nombres
                    </button>
                </section>

                <p id="sidebar-status" class="sidebar__status" role="status" aria-live="polite"></p>
            </div>
        </aside>

        <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

        <main class="main">
            <header class="app-header">
                <h1 class="app-header__title">Ruleta</h1>
                <p class="app-header__subtitle">Configura desde el panel lateral y haz girar</p>
            </header>

            <section class="roulette" aria-label="Ruleta">
                <div class="roulette__stage">
                    <div class="roulette__pointer" aria-hidden="true">
                        <svg class="roulette__pointer-icon" viewBox="0 0 24 24">
                            <path d="M4 4h16l-8 17z" fill="currentColor" />
                        </svg>
                    </div>
                    <canvas
                        id="roulette-canvas"
                        class="roulette__canvas"
                        width="500"
                        height="500"
                        role="img"
                        aria-label="Ruleta de opciones"
                    >
                        Tu navegador no admite canvas.
                    </canvas>
                </div>

                <button id="spin-button" class="action action--spin" type="button">
                    <svg
                        class="action__icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        aria-hidden="true"
                    >
                        <rect x="4" y="4" width="16" height="16" rx="4" />
                        <circle cx="9" cy="9" r="1.25" fill="currentColor" stroke="none" />
                        <circle cx="15" cy="9" r="1.25" fill="currentColor" stroke="none" />
                        <circle cx="12" cy="12" r="1.25" fill="currentColor" stroke="none" />
                        <circle cx="9" cy="15" r="1.25" fill="currentColor" stroke="none" />
                        <circle cx="15" cy="15" r="1.25" fill="currentColor" stroke="none" />
                    </svg>
                    Girar
                </button>

                <div class="result" aria-live="polite">
                    <span class="result__label">Resultado:</span>
                    <span id="result-value" class="result__value">---</span>
                </div>
            </section>
        </main>

        <script type="module" src="./js/app.js"></script>
    </body>
</html>
