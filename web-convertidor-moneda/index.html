<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convertidor De Monedas</title>
    <link rel="icon" href="icon/convertidor_moneda.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>
<body>
    <main>
        <div class="app-card">
            <h1>Convertidor De Monedas</h1>
            <div class="currency-row">
                <div class="from-section">
                    <label class="field-label" for="from-select">DESDE</label>
                    <div class="from-select-wrapper">
                        <select id="from-select"></select>
                    </div>
                </div>
                <button type="button" id="swap-control" class="swap-button" aria-label="Intercambiar monedas">
                    <span class="material-icons">sync_alt</span>
                </button>
                <div class="to-section">
                    <label class="field-label" for="to-select">HASTA</label>
                    <div class="to-select-wrapper">
                        <select id="to-select"></select>
                    </div>
                </div>
            </div>
            <div class="amount-group">
                <label class="field-label" for="amount-input">Cantidad</label>
                <input type="number" id="amount-input" placeholder="Escriba la cantidad" />
            </div>
            <div class="actions">
                <button type="button" class="convert-button">Realizar conversión</button>
            </div>
            <div id="result-box" role="status" aria-live="polite"></div>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
