<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Convertidor de monedas con tasas de cambio actualizadas y cálculo instantáneo entre divisas."
        />
        <meta name="theme-color" content="#f8fafc" />
        <title>Convertidor De Monedas</title>
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="css/styles.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <main class="page">
            <section class="app-card" aria-labelledby="app-title">
                <header class="app-card__header">
                    <h1 class="app-card__title" id="app-title">Convertidor De Monedas</h1>
                </header>

                <div class="currency-row">
                    <div class="currency-field">
                        <label class="field-label" for="from-select">DESDE</label>
                        <div class="select-wrapper">
                            <select id="from-select"></select>
                        </div>
                    </div>
                    <button
                        type="button"
                        id="swap-control"
                        class="swap-button"
                        aria-label="Intercambiar monedas"
                    >
                        <svg
                            class="swap-button__icon"
                            viewBox="0 0 24 24"
                            width="20"
                            height="20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                            focusable="false"
                        >
                            <path d="M7 7h10m0 0-3-3m3 3-3 3M17 17H7m0 0 3 3m-3-3 3-3" />
                        </svg>
                    </button>
                    <div class="currency-field">
                        <label class="field-label" for="to-select">HASTA</label>
                        <div class="select-wrapper">
                            <select id="to-select"></select>
                        </div>
                    </div>
                </div>

                <div class="amount-group">
                    <label class="field-label" for="amount-input">Cantidad</label>
                    <input
                        type="number"
                        id="amount-input"
                        placeholder="Escriba la cantidad"
                        inputmode="decimal"
                    />
                </div>

                <div class="actions">
                    <button type="button" class="convert-button">Realizar conversión</button>
                </div>

                <div class="result-box" id="result-box" role="status" aria-live="polite"></div>
            </section>
        </main>
        <script type="module" src="js/app.js"></script>
    </body>
</html>
