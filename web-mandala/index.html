<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mandalas en l&iacute;nea</title>
        <meta
            name="description"
            content="Colorea mandalas generados proceduralmente en tu navegador y gu&aacute;rdalos en PNG o SVG o impr&iacute;melos."
        />

        <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;family=Instrument+Serif&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght@20..48,100..700&amp;display=block"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <main class="workshop">
            <nav class="panel panel--tools" aria-label="Herramientas de coloreado">
                <h1 class="panel__title">Mandalas</h1>
                <p class="panel__subtitle">Colorea, guarda e imprime. Sin registro.</p>

                <section class="tools__group">
                    <h2 class="tools__caption">Plantilla</h2>
                    <label class="sr-only" for="template-select">Plantilla del mandala</label>
                    <select id="template-select" class="tools__select"></select>
                </section>

                <section class="tools__group">
                    <h2 class="tools__caption">Colores</h2>
                    <div id="palette" class="palette"></div>
                    <label class="tools__custom">
                        <span class="material-symbols-outlined" aria-hidden="true">palette</span>
                        <span class="sr-only">Elegir color personalizado</span>
                        <input id="color-input" type="color" class="tools__color" value="#e6454f" />
                    </label>
                </section>

                <section class="tools__group">
                    <h2 class="tools__caption">Acciones</h2>
                    <div class="tools__actions">
                        <button
                            id="draft-btn"
                            type="button"
                            class="tool"
                            aria-label="Borrador (rellenar en blanco)"
                            aria-pressed="false"
                            title="Borrador"
                        >
                            <span class="material-symbols-outlined" aria-hidden="true"
                                >ink_eraser</span
                            >
                        </button>
                        <button
                            id="undo-btn"
                            type="button"
                            class="tool"
                            aria-label="Deshacer &uacute;ltimo cambio"
                            title="Deshacer"
                            disabled
                        >
                            <span class="material-symbols-outlined" aria-hidden="true">undo</span>
                        </button>
                        <button
                            id="redo-btn"
                            type="button"
                            class="tool"
                            aria-label="Rehacer &uacute;ltimo cambio"
                            title="Rehacer"
                            disabled
                        >
                            <span class="material-symbols-outlined" aria-hidden="true">redo</span>
                        </button>
                        <button
                            id="clear-btn"
                            type="button"
                            class="tool"
                            aria-label="Limpiar todo el mandala"
                            title="Limpiar todo"
                        >
                            <span class="material-symbols-outlined" aria-hidden="true"
                                >cleaning_services</span
                            >
                        </button>
                        <button
                            id="print-btn"
                            type="button"
                            class="tool"
                            aria-label="Imprimir el mandala"
                            title="Imprimir"
                        >
                            <span class="material-symbols-outlined" aria-hidden="true">print</span>
                        </button>
                        <button
                            id="download-btn"
                            type="button"
                            class="tool"
                            aria-label="Descargar el mandala en PNG"
                            title="Descargar PNG"
                        >
                            <span class="material-symbols-outlined" aria-hidden="true"
                                >download</span
                            >
                        </button>
                        <button
                            id="download-svg-btn"
                            type="button"
                            class="tool"
                            aria-label="Descargar el mandala en SVG"
                            title="Descargar SVG"
                        >
                            <span class="material-symbols-outlined" aria-hidden="true">code</span>
                        </button>
                    </div>
                </section>

                <p class="panel__footer">Web Mandala</p>
            </nav>

            <section class="panel panel--canvas" aria-label="Mandala para colorear">
                <figure class="canvas">
                    <div id="mandala-container" class="canvas__surface"></div>
                    <figcaption id="canvas-caption" class="canvas__caption"></figcaption>
                </figure>
                <p id="status" class="status" role="status" aria-live="polite"></p>
            </section>
        </main>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
