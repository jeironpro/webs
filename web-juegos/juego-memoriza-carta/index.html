<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoriza La Carta</title>
    <link rel="icon" href="img/pares.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div id="contenedor-principal">
            <header class="encabezado">
                <h1>Memoriza La Carta</h1>
                <p>Encuentra todas las parejas de animales</p>
            </header>
            <section id="tablero-juego" class="tablero">
                <!-- Las cartas se generarán dinámicamente mediante JavaScript -->
            </section>
            <footer class="controles">
                <button id="boton-reiniciar" class="boton">Reiniciar Juego</button>
            </footer>
        </div>
    </main>

    <!-- Modal de Victoria -->
    <div id="modal-victoria" class="modal">
        <div class="modal-contenido">
            <h2>¡Felicidades!</h2>
            <p>Has encontrado todas las parejas de animales.</p>
            <button id="boton-cerrar-modal" class="boton">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
