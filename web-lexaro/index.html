<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexaro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='a' x1='0' y1='0' x2='32' y2='32'><stop offset='0' stop-color='%230052CC'/><stop offset='1' stop-color='%236554C0'/></linearGradient></defs><rect width='32' height='32' rx='6' fill='url(%23a)'/><rect x='4' y='4' width='24' height='6' rx='1' fill='white'/><rect x='4' y='12' width='24' height='6' rx='1' fill='white' opacity='0.9'/><rect x='4' y='20' width='24' height='6' rx='1' fill='white' opacity='0.8'/></svg>">
</head>
<body>
    <header class="encabezado">
        <div class="contenido-encabezado">
            <div class="logo">
                <i class="fas fa-th-large"></i>
                <h1>Lexaro</h1>
            </div>
            <div class="acciones-encabezado">
                <button class="boton boton-primario" id="boton-agregar-tarea">
                    <i class="fas fa-plus"></i>
                    Crear Tarea
                </button>
                <div class="menu-usuario">
                    <div class="avatar-usuario">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="contenido-principal">
        <div class="encabezado-tablero">
            <div class="titulo-tablero">
                <h2>Tablero de tareas</h2>
                <span class="estadisticas-tablero">0 tareas</span>
            </div>
            <div class="filtros-tablero">
                <button class="boton-filtro activo" data-filtro="todas">Todas</button>
                <button class="boton-filtro" data-filtro="alta">Alta Prioridad</button>
                <button class="boton-filtro" data-filtro="media">Media Prioridad</button>
                <button class="boton-filtro" data-filtro="baja">Baja Prioridad</button>
            </div>
        </div>

        <div class="tablero-kanban">
            <div class="columna" data-estado="hacer">
                <div class="encabezado-columna">
                    <div class="titulo-columna">
                        <h3>To Do</h3>
                        <span class="contador-tareas">0</span>
                    </div>
                    <button class="menu-columna">
                        <i class="fas fa-ellipsis-h"></i>
                    </button>
                </div>
                <div class="contenido-columna">
                    <!-- Tasks will be dynamically created here -->
                </div>
            </div>

            <div class="columna" data-estado="progreso">
                <div class="encabezado-columna">
                    <div class="titulo-columna">
                        <h3>En Progreso</h3>
                        <span class="contador-tareas">0</span>
                    </div>
                    <button class="menu-columna">
                        <i class="fas fa-ellipsis-h"></i>
                    </button>
                </div>
                <div class="contenido-columna">
                    <!-- Tasks will be dynamically created here -->
                </div>
            </div>

            <div class="columna" data-estado="revision">
                <div class="encabezado-columna">
                    <div class="titulo-columna">
                        <h3>En Revisión</h3>
                        <span class="contador-tareas">0</span>
                    </div>
                    <button class="menu-columna">
                        <i class="fas fa-ellipsis-h"></i>
                    </button>
                </div>
                <div class="contenido-columna">
                    <!-- Tasks will be dynamically created here -->
                </div>
            </div>

            <div class="columna" data-estado="completado">
                <div class="encabezado-columna">
                    <div class="titulo-columna">
                        <h3>Completado</h3>
                        <span class="contador-tareas">0</span>
                    </div>
                    <button class="menu-columna">
                        <i class="fas fa-ellipsis-h"></i>
                    </button>
                </div>
                <div class="contenido-columna">
                    <!-- Tasks will be dynamically created here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modal para crear/editar tareas -->
    <div class="modal" id="modal-tarea">
        <div class="contenido-modal">
            <div class="encabezado-modal">
                <h3>Crear Nueva Tarea</h3>
                <button class="cerrar-modal" id="cerrar-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form class="formulario-tarea">
                <div class="grupo-formulario">
                    <label for="titulo-tarea">Título</label>
                    <input type="text" id="titulo-tarea" required>
                </div>
                <div class="grupo-formulario">
                    <label for="descripcion-tarea">Descripción</label>
                    <textarea id="descripcion-tarea" rows="3"></textarea>
                </div>
                <div class="grupo-formulario">
                    <label for="prioridad-tarea">Prioridad</label>
                    <select id="prioridad-tarea">
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>
                <div class="grupo-formulario">
                    <label for="estado-tarea">Estado</label>
                    <select id="estado-tarea">
                        <option value="hacer">To Do</option>
                        <option value="progreso">En Progreso</option>
                        <option value="revision">En Revisión</option>
                        <option value="completado">Completado</option>
                    </select>
                </div>
                <div class="grupo-formulario">
                    <label for="etiquetas-tarea">Etiquetas (separadas por comas)</label>
                    <input type="text" id="etiquetas-tarea" placeholder="Ej: frontend, diseño">
                </div>
                <div class="grupo-formulario">
                    <label for="fecha-inicio-tarea">Fecha de Inicio</label>
                    <input type="date" id="fecha-inicio-tarea">
                </div>
                <div class="grupo-formulario">
                    <label for="fecha-fin-tarea">Fecha de Fin</label>
                    <input type="date" id="fecha-fin-tarea">
                </div>
                <div class="acciones-formulario">
                    <button type="button" class="boton boton-secundario" id="boton-cancelar">Cancelar</button>
                    <button type="submit" class="boton boton-primario">Crear Tarea</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmación Genérica -->
    <div class="modal" id="modal-confirmacion">
        <div class="contenido-modal modal-confirmacion">
            <div class="encabezado-modal">
                <h3 id="titulo-confirmacion">Confirmar Acción</h3>
                <button class="cerrar-modal" id="cerrar-modal-confirmacion">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="cuerpo-modal">
                <div class="icono-confirmacion" id="icono-confirmacion">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <p class="mensaje-confirmacion" id="mensaje-confirmacion">¿Estás seguro de que quieres realizar esta acción?</p>
                <p class="descripcion-confirmacion" id="descripcion-confirmacion">Esta acción no se puede deshacer.</p>
            </div>
            <div class="pie-modal">
                <button type="button" class="boton boton-secundario" id="boton-cancelar-confirmacion">Cancelar</button>
                <button type="button" class="boton boton-primario" id="boton-confirmar-confirmacion">
                    <span id="texto-boton-confirmar">Confirmar</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
