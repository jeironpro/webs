JAVA VS PYTHON:
  - Java
    · Java es un lenguaje compilado.
    · Java está escrito estáticamente.
    · Curva de aprendizaje compleja.
    · Multiples herencias se realizan parcialmente a traves de interfaces.
    · Utiliza llaves para definir el inicio y el final de cada funcion y definicion de clase.
    · El programa Java se ejecuta lentamente en comparación con Python.
    · Cualquier ordenador o dispositivo móvil que sea capaz de ejecutar la máquina virtual Java puede ejecutar una aplicación Java.
    · Grandes bibliotecas.
    · Ampliamente utilizado.
    · Excelentes herramientas.
    · Gran cantidad de documentacion disponible.
    · Java es el mejor para aplicaciones de usuario, sistemas embebidos, servicios de aplicaciones web, etc.

    - Frameworks del backend
      Spring, Blade.

    - Bibliotecas de aprendizaje automatico
      Weka, Mallet, Deeplearning4j, MOA.

  - Python
    · Python es un lenguaje interpretado.
    · Python está escrito dinámicamente.
    · Facil de aprender y utilizar.
    · Ofrece tanto herencia unica como multiple.
    · Python utiliza la indentación para separar el código en bloques.
    · Los programas Python se ejecutan más rápido que Java.
    · Los programas Python necesitan un intérprete instalado en la máquina de destino para traducir el código Python. En comparación con Java, Python es menos portátil.
    · Codigo legible.
    · Desarrollo rápido.
    · Codigo limpio.
    · Python es excelente para la computación científica y numérica, aplicaciones de aprendizaje automático, más.

    - Frameworks del backend
      Django, Flask.

    - Bibliotecas de aprendizaje automatico
      Tensorflow, Pytorch.
