TIPOS_DE_DATOS_BASICOS_PYTHON:
  - PRIMITIVOS:
      - Entero             -> int         -> 10
      - Flotante           -> float       -> 3.14
      - Cadena_de_texto    -> str         -> "Hola"
      - Booleano           -> bool        -> True / False
      - Complejo           -> complex     -> 1 + 2j
      - Bytes              -> bytes       -> b"Hola"
      - Nulo               -> NoneType    -> None

  - ESTRUCTURAS:
      - Lista_o_Pila       -> list        -> [1, 2, 3]
      - Tupla              -> tuple       -> (1, 2, 3)
      - Conjunto           -> set         -> {1, 2, 3}
      - Conjunto_inmutable -> frozenset   -> frozenset({1, 2, 3})
      - Diccionario        -> dict        -> {"clave": "valor"}
      - Bytearray          -> bytearray   -> bytearray(5)
      - Rango              -> range       -> range(5)
      - Vista_de_memoria   -> memoryview  -> memoryview(bytes(5))
