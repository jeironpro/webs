SELECTORES CSS:
  · *:                -> Selector Universal
  · id:               -> Selector de ID
  · class:            -> Selector de Clase
  · h1, p:            -> Selector de Tipo
  · h1+p:             -> Selector de Hermano Adyacente
  · ul > li:          -> Selector de Hijo
  · h1 ~ p:           -> Selector de Hermano General
  · li a:             -> Selector de Descendiente
  · div[att="val"]:   -> Selector de Atributo
