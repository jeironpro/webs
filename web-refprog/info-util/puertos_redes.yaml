network_ports:
  - port: 20
    protocol: TCP
    use: FTP (Transferencia de Datos)
  - port: 21
    protocol: TCP
    use: FTP (Control)
  - port: 22
    protocol: TCP
    use: SSH (Shell Seguro)
  - port: 23
    protocol: TCP
    use: Telnet (Inicio de Sesion Remoto)
  - port: 55
    protocol: UDP/TCP
    use: DNS (Resolución de Dominios)
  - port: 67
    protocol: UDP
    use: DHCP (Servidor a Cliente)
  - port: 68
    protocol: UDP
    use: DHCP (Cliente a Servidor)
  - port: 69
    protocol: UDP
    use: TFTP (Transferencia de Archivos Trivial)
  - port: 80
    protocol: TCP
    use: HTTP (Navegación Web)
  - port: 110
    protocol: TCP
    use: POP3 (Recepcion de Correo)
  - port: 123
    protocol: UDP
    use: NTP (Sincronización de Tiempo)
  - port: 138
    protocol: UDP
    use: NetBIOS (Servicio de Nombres)
  - port: 139
    protocol: TCP
    use: NetBIOS (Servicio de Datagramas)
  - port: 143
    protocol: TCP
    use: IMAP (Recepcion de Correo)
  - port: 161
    protocol: UDP
    use: SNMP (Gestión de Red)
  - port: 443
    protocol: TCP
    use: HTTPS (Navegación Web Segura)
  - port: 445
    protocol: TCP
    use: SMB (Compartición de Archivos)
  - port: 3389
    protocol: TCP
    use: RDP (Escritorio Remoto)
