FUNCIONES PYTHON:
  - print():                          -> Muestra por pantalla estandar en la consola
  - input():                          -> Permite la entrada de datos en la consola
  - len():                            -> Retorna la cantidad de elementos
  - type():                           -> Retorna el tipo de datos
  - range():                          -> Genera una secuencia de números en el rango especificado
  - int(), float(), str():            -> Convierte al tipo de datos correspondiente
  - list(), tuple(), set(), dict():   -> Crea o convierte a colecciones
  - sum():                            -> Suma todos los elementos iterables
  - min(), max():                     -> Encuentra el mínimo y el máximo respectivamente
  - sorted():                         -> Ordena elementos de conjuntos de datos iterables
  - abs():                            -> Retorna el valor absoluto de un numero
  - round():                          -> Redondea un numero con decimales concretos
  - map():                            -> Aplica una funcion a cada elemento iterado
  - filter():                         -> Filtra elementos iterables segun una condicion
  - reduce():                         -> Aplica una funcion a los elementos iterables para reducirlos a un unico valor
  - enumerate():                      -> Agrega un índice a cada elemento iterable
  - zip():                            -> Une iterables en pares de elementos
  - open():                           -> Abre un archivo para leer, escribir o modificar
  - isinstance():                     -> Comprueba si una variable es de un tipo concreto
  - issubclass():                     -> Comprueba relaciones entre clases
  - hasattr():                        -> Verifica si un objeto tiene un atributo
  - getattr():                        -> Obtiene el valor de un atributo
  - setattr():                        -> Asigna un valor a un atributo
  - delattr():                        -> Elimina un atributo de un objeto
  - help():                           -> Muestra la documentacion de un objeto o modulo
  - id():                             -> Retorna la identificación única en memoria
  - next():                           -> Retorna el siguiente valor de un iterador
  - iter():                           -> Transforma un iterable en un iterador
  - chr(), ord():                     -> Trabaja con valores Unicode de caracteres
  - bin(), oct(), hex():              -> Convierte valores a las diferentes representaciones en base
  - any(), all():                     -> Evalua condiciones en iterables para al menos uno o todos los elementos
  - pow():                            -> Calcula una potencia
  - divmod():                         -> Retorna el cociente y el resto de una division
  - copy():                           -> Crea una copia superficial de un objeto
  - eval():                           -> Ejecuta una expresión en forma de cadena
  - exec():                           -> Ejecuta un bloque de código en forma de cadena
  - format():                         -> Formatea cadenas con valores personalizados
  - reversed():                       -> Invierte el orden de un iterable
  - slice():                          -> Crea una porcion de un iterable sin modificarlo
  - callable():                       -> Verifica si es invocable como una funcion
  - dir():                            -> Muestra los atributos y métodos de un objeto
  - frozenset():                      -> Crea un conjunto inmutable
  - complex():                        -> Crea numeros complejos
  - bool():                           -> Transforma un valor en booleano
  - super():                          -> Retorna un proxy que delega en la superclase
  - globals():                        -> Retorna las variables globales
  - locals():                         -> Retorna las variables locales
