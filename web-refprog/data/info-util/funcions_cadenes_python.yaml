FUNCIONES_DE_CADENA_EN_PYTHON:
  - .capitalize():                     -> Convierte la primera letra en mayúscula y el resto en minúsculas.
  - .casefold():                       -> Convierte toda la cadena a minúsculas de forma más agresiva que .lower(), útil para comparaciones.
  - .center(valor):                    -> Centra la cadena dentro de un espacio del tamaño indicado, añadiendo espacios o caracteres a ambos lados.
  - .count('caracter'):                -> Cuenta cuántas veces aparece un fragmento o carácter dentro de la cadena.
  - .encode():                         -> Convierte la cadena en bytes segun una codificacion (por defecto UTF-8).
  - .endswith('cadena'):               -> Retorna True si la cadena termina con el fragmento indicado.
  - .expandtabs(valor):                -> Sustituye los tabuladores \\t por espacios, segun el valor dado.
  - .find('cadena'):                   -> Retorna la posición (índice) de la primera aparición del fragmento, o -1 si no se encuentra.
  - .format(format):                   -> Inserta valores dentro de la cadena utilizando placeholders {}.
  - .index('cadena'):                  -> Igual que .find(), pero genera un error si no se encuentra el fragmento.
  - .split(separador):                 -> Divide la cadena en una lista, utilizando el separador indicado.
  - .replace('a reemplazar', 'nuevo'): -> Sustituye todas las ocurrencias de un fragmento por otro.
  - .isdigit():                        -> Retorna True si todos los caracteres son dígitos.
  - .isalpha():                        -> Retorna True si todos los caracteres son letras.
  - .zfill():                          -> Rellena la cadena con ceros a la izquierda hasta alcanzar la longitud especificada.
  - .upper():                          -> Convierte todos los caracteres a mayusculas.
  - .swapcase():                       -> Invierte mayusculas a minusculas y viceversa.
  - .isalnum():                        -> Retorna True si todos los caracteres son alfanuméricos (letras o números).
  - .isascii():                        -> Retorna True si todos los caracteres son ASCII.
  - .isdecimal():                      -> Retorna True si todos los caracteres son decimales (0-9).
  - .isidentifier():                   -> Retorna True si la cadena puede ser un identificador valido en Python.
  - .islower():                        -> Retorna True si todos los caracteres son minúsculas.
  - .isprintable():                    -> Retorna True si todos los caracteres son imprimibles.
  - .isspace():                        -> Retorna True si todos los caracteres son espacios o caracteres en blanco.
  - .maketrans():                      -> Crea una tabla de traduccion para utilizar con .translate().
  - .rjust(valor):                     -> Justifica la cadena a la derecha dentro de un espacio del tamaño indicado.
  - .rpartition('caracter'):           -> Divide la cadena en tres partes: antes, el separador y después (comenzando por la derecha).
  - .startswith('cadena'):             -> Retorna True si la cadena comienza con el fragmento indicado.
  - .rsplit('caracter'):               -> Divide la cadena desde el final utilizando el separador indicado.
  - .splitlines():                     -> Divide la cadena en una lista por líneas (salto de línea \\n).
