<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Calendario anual</title>
        <meta
            name="description"
            content="Calendario anual con los doce meses, la semana de lunes a domingo y el día de hoy destacado."
        />
        <meta name="theme-color" content="#f6f1e7" />
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="calendar-header">
            <p class="calendar-header__eyebrow">doce meses</p>
            <h1 class="calendar-header__title" id="calendar-title">Calendario</h1>
            <p class="calendar-header__subtitle">Vista anual con el día de hoy destacado.</p>
        </header>

        <main class="calendar-main" aria-labelledby="calendar-title">
            <div class="calendar" id="calendar" aria-label="Calendario anual"></div>
        </main>

        <footer class="calendar-footer">
            &copy; Todos los derechos reservados <span data-year>2026</span> - JeironPro
        </footer>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
