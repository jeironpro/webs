<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>webs · Página no encontrada</title>
        <meta name="robots" content="noindex" />
        <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
        <script>
            // Fallback SPA para GitHub Pages: Pages solo sirve este 404.html raiz en
            // cualquier ruta inexistente. Si la URL cae dentro de una app SPA del
            // monorepo, se redirige a su directorio adjuntando la subruta en la query
            // (?/subruta); un script en el index.html de la app la restaura con
            // history.replaceState. Para dar de alta otra SPA, añade su id al patron.
            (function () {
                var ruta = window.location.pathname.replace(new RegExp("/+", "g"), "/");
                var m = ruta.match(
                    new RegExp("/(web-exerciness|web-codelang-quiz|web-pokemon)(/|$)")
                );
                if (!m) return;
                var base = ruta.slice(0, m.index) + "/" + m[1] + "/";
                var subruta = ruta.slice(base.length);
                if (subruta.endsWith("index.html")) subruta = subruta.slice(0, -10);
                if (subruta.endsWith("/")) subruta = subruta.slice(0, -1);
                var query =
                    window.location.search.length > 1 ? "&" + window.location.search.slice(1) : "";
                window.location.replace(
                    window.location.origin +
                        base +
                        (subruta ? "?/" + subruta : "") +
                        query +
                        window.location.hash
                );
            })();
        </script>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                font-family:
                    "Inter",
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: #f6f5f1;
                color: #1c1c1a;
                text-align: center;
                padding: 2rem;
                box-sizing: border-box;
            }
            main {
                max-width: 32rem;
            }
            .codigo {
                font-family: "JetBrains Mono", ui-monospace, monospace;
                font-size: 4.5rem;
                font-weight: 600;
                margin: 0;
                letter-spacing: -0.03em;
            }
            h1 {
                font-size: 1.4rem;
                margin: 0.5rem 0 1rem;
            }
            p {
                color: #5c5b55;
                line-height: 1.6;
                margin: 0 0 1.75rem;
            }
            a {
                display: inline-block;
                padding: 0.7rem 1.4rem;
                border-radius: 999px;
                background: #1c1c1a;
                color: #fff;
                text-decoration: none;
                font-weight: 600;
            }
            a:hover {
                background: #3a3a36;
            }
        </style>
    </head>
    <body>
        <main>
            <p class="codigo">404</p>
            <h1>Página no encontrada</h1>
            <p>
                La ruta que buscas no existe en este monorepo. Si venías de una app con navegación
                interna, prueba a entrar desde su página principal.
            </p>
            <a href="./">Volver al catálogo</a>
        </main>
    </body>
</html>
