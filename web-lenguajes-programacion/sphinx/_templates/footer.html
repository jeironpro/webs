{# Custom footer: copyright with dynamic year (JS), without the
   "Built with Sphinx..." line (removed via html_show_sphinx = False). #}
{% extends "!footer.html" %}

{%- block contentinfo %}
  <p>
    © Copyright <span id="year-copyright"></span> jeironpro.
  </p>
  <script>
    document.getElementById("year-copyright").textContent =
      new Date().getFullYear();
  </script>
{%- endblock %}
