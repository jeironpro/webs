<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="assets/images/cocaina.png" type="image/x-icon" />
        <title>Imperios del Narco | Top 10</title>
        <link rel="stylesheet" href="css/styles.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="app" class="container">
            <!-- Vista de Inicio -->
            <section id="home-view">
                <header>
                    <h1 class="title">IMPERIOS DEL NARCO</h1>
                    <p class="subtitle">
                        Los 10 señores de la droga más impactantes de la historia
                    </p>

                    <nav class="main-nav">
                        <button id="nav-bosses" class="nav-button active">Capos</button>
                        <button id="nav-organizations" class="nav-button">Organizaciones</button>
                    </nav>
                </header>

                <main id="bosses-grid" class="bosses-grid">
                    <!-- Las tarjetas de capos se inyectarán aquí mediante JS -->
                </main>

                <main id="organizations-grid" class="bosses-grid" style="display: none">
                    <!-- Las tarjetas de organizaciones se inyectarán aquí mediante JS -->
                </main>
            </section>
            <!-- Vista de Detalle (Oculta por defecto) -->
            <section id="detail-view" class="detail-view" style="display: none">
                <button id="back-button" class="back-button">← Volver a la Lista</button>
                <div id="detail-content">
                    <!-- El contenido de detalle se inyectará aquí mediante JS -->
                </div>
            </section>
        </div>
        <script type="module" src="js/script.js"></script>
    </body>
</html>
