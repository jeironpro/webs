<!doctype html>
<html lang="es">
    <head>
        <!-- Punto de entrada HTML de la aplicación. Carga Google Analytics, fuentes y el bundle React. -->
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZTPH1017ZF"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-ZTPH1017ZF');
        </script>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="./pokemon.png" />
        <script>
            // GitHub Pages sirve el 404.html raiz en subrutas de la SPA (p. ej.
            // /web-pokemon/generation/1); ese fallback redirige aqui con la subruta
            // en la query (?/generation/1) y este script la restaura en la barra de
            // direcciones para que el router la resuelva sin recargar.
            (function () {
                var busqueda = window.location.search;
                if (busqueda.indexOf('?/') === 0) {
                    var resta = busqueda.slice(2);
                    var amp = resta.indexOf('&');
                    if (amp !== -1) resta = resta.slice(0, amp) + '?' + resta.slice(amp + 1);
                    window.history.replaceState(
                        null,
                        '',
                        window.location.pathname.replace(/index\.html$/, '') + resta + window.location.hash,
                    );
                }
            })();
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet"
        />
        <title>Pokémon</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
