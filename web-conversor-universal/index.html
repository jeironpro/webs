<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Conversor universal de unidades: longitud, masa, temperatura, energía, datos y muchas categorías más."
        />
        <meta name="theme-color" content="#b9b6ae" />
        <title>Conversor Universal</title>
        <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600&family=Archivo:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="slab">
            <div class="slab__in shell">
                <a class="slab__mark" href="index.html"> Conversor<span>Universal</span> </a>
                <p class="slab__note">Una herramienta · cualquier unidad</p>
            </div>
        </header>

        <main>
            <section class="hero shell" aria-label="Conversor de unidades">
                <h1 class="sr-only">Conversor Universal</h1>
                <p class="hero__lead">
                    Elige una categoría, escribe un valor y obtén el resultado al instante.
                </p>
            </section>

            <section class="workspace shell" aria-label="Conversor de unidades">
                <aside class="categories">
                    <div class="rule-head">
                        <p class="kicker">01 · Qué mides</p>
                        <h2>Categorías</h2>
                    </div>
                    <nav aria-label="Categorías de conversión">
                        <ul class="category-list" id="category-list"></ul>
                    </nav>
                </aside>

                <section
                    class="converter"
                    id="converter"
                    aria-label="Conversor de unidades"
                    aria-live="polite"
                >
                    <p class="converter__hint">Selecciona una categoría</p>
                </section>
            </section>
        </main>

        <footer class="foot">
            <div class="shell foot__in">
                <p class="foot__mark">Conversor Universal</p>
                <p class="foot__note">Todos los derechos reservados - 2026 jeironpro</p>
            </div>
        </footer>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
