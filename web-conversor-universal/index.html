<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Conversor universal de unidades: longitud, masa, temperatura, energía, datos y muchas categorías más."
        />
        <meta name="theme-color" content="#fafafa" />
        <title>Conversor Universal</title>
        <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <main class="app-layout">
            <aside class="sidebar" id="sidebar">
                <header class="brand">
                    <a class="brand__link" href="index.html">
                        <img
                            class="brand__logo"
                            src="assets/icons/conversion.png"
                            alt=""
                            width="50"
                            height="50"
                        />
                        <h1 class="brand__title">Conversor Universal</h1>
                    </a>
                </header>

                <nav class="category-nav" aria-label="Categorías de conversión">
                    <ul class="category-list" id="category-list"></ul>
                </nav>
            </aside>

            <section class="converter" id="converter" aria-label="Conversor de unidades">
                <p class="converter__hint">Selecciona una categoría</p>
            </section>
        </main>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
