<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Calculadora básica para sumar, restar, multiplicar, dividir, calcular porcentajes y raíces cuadradas."
        />
        <meta name="theme-color" content="#121212" />
        <title>Calculadora · operaciones básicas</title>
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="css/styles.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <main class="calculator-main">
            <header class="calculator-header">
                <p class="calculator-header__eyebrow">Básica</p>
                <h1 class="calculator-header__title">Calculadora</h1>
            </header>
            <section class="calculator" aria-label="Calculadora">
                <div class="calculator__display">
                    <output
                        class="calculator__screen"
                        id="display"
                        aria-atomic="true"
                        aria-label="Pantalla de resultados"
                        aria-live="polite"
                        >0</output
                    >
                </div>
                <div class="calculator__keypad" id="keypad">
                    <button
                        class="calculator__button calculator__button--action"
                        data-action="clear-all"
                        type="button"
                        aria-label="Limpiar todo"
                    >
                        AC
                    </button>
                    <button
                        class="calculator__button calculator__button--action"
                        data-action="clear"
                        type="button"
                        aria-label="Borrar el último carácter"
                    >
                        C
                    </button>
                    <button
                        class="calculator__button calculator__button--operator"
                        data-operator="%"
                        type="button"
                        aria-label="Porcentaje"
                    >
                        %
                    </button>
                    <button
                        class="calculator__button calculator__button--operator"
                        data-operator="√"
                        type="button"
                        aria-label="Raíz cuadrada"
                    >
                        √
                    </button>

                    <button
                        class="calculator__button calculator__button--number"
                        data-digit="7"
                        type="button"
                    >
                        7
                    </button>
                    <button
                        class="calculator__button calculator__button--number"
                        data-digit="8"
                        type="button"
                    >
                        8
                    </button>
                    <button
                        class="calculator__button calculator__button--number"
                        data-digit="9"
                        type="button"
                    >
                        9
                    </button>
                    <button
                        class="calculator__button calculator__button--operator"
                        data-operator="/"
                        type="button"
                        aria-label="Dividir"
                    >
                        &divide;
                    </button>

                    <button
                        class="calculator__button calculator__button--number"
                        data-digit="4"
                        type="button"
                    >
                        4
                    </button>
                    <button
                        class="calculator__button calculator__button--number"
                        data-digit="5"
                        type="button"
                    >
                        5
                    </button>
                    <button
                        class="calculator__button calculator__button--number"
                        data-digit="6"
                        type="button"
                    >
                        6
                    </button>
                    <button
                        class="calculator__button calculator__button--operator"
                        data-operator="*"
                        type="button"
                        aria-label="Multiplicar"
                    >
                        ×
                    </button>

                    <button
                        class="calculator__button calculator__button--number"
                        data-digit="1"
                        type="button"
                    >
                        1
                    </button>
                    <button
                        class="calculator__button calculator__button--number"
                        data-digit="2"
                        type="button"
                    >
                        2
                    </button>
                    <button
                        class="calculator__button calculator__button--number"
                        data-digit="3"
                        type="button"
                    >
                        3
                    </button>
                    <button
                        class="calculator__button calculator__button--operator"
                        data-operator="-"
                        type="button"
                        aria-label="Restar"
                    >
                        −
                    </button>

                    <button
                        class="calculator__button calculator__button--number"
                        data-digit="0"
                        type="button"
                    >
                        0
                    </button>
                    <button
                        class="calculator__button calculator__button--number"
                        data-digit="."
                        type="button"
                        aria-label="Punto decimal"
                    >
                        .
                    </button>
                    <button
                        class="calculator__button calculator__button--equals"
                        data-action="equals"
                        type="button"
                        aria-label="Igual"
                    >
                        =
                    </button>
                    <button
                        class="calculator__button calculator__button--operator"
                        data-operator="+"
                        type="button"
                        aria-label="Sumar"
                    >
                        +
                    </button>
                </div>
            </section>
        </main>
        <script type="module" src="js/app.js"></script>
    </body>
</html>
