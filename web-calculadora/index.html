<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Calculadora</title>
        <link rel="icon" href="assets/icons/calculator.png" />
        <link rel="stylesheet" href="css/styles.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <main class="app">
            <div class="calculator">
                <div class="display">
                    <input
                        type="text"
                        placeholder="0"
                        id="display"
                        class="screen"
                        readonly
                        aria-label="Pantalla de resultados"
                    />
                </div>
                <div class="keypad">
                    <button
                        data-action="clear-all"
                        class="button button--action"
                        aria-label="Limpiar todo"
                    >
                        AC
                    </button>
                    <button
                        data-action="clear"
                        class="button button--action"
                        aria-label="Borrar último"
                    >
                        C
                    </button>
                    <button data-operator="%" class="button button--operator">%</button>
                    <button data-operator="√" class="button button--operator">√</button>

                    <button data-digit="7" class="button button--number">7</button>
                    <button data-digit="8" class="button button--number">8</button>
                    <button data-digit="9" class="button button--number">9</button>
                    <button data-operator="/" class="button button--operator">&divide;</button>

                    <button data-digit="4" class="button button--number">4</button>
                    <button data-digit="5" class="button button--number">5</button>
                    <button data-digit="6" class="button button--number">6</button>
                    <button data-operator="*" class="button button--operator">×</button>

                    <button data-digit="1" class="button button--number">1</button>
                    <button data-digit="2" class="button button--number">2</button>
                    <button data-digit="3" class="button button--number">3</button>
                    <button data-operator="-" class="button button--operator">−</button>

                    <button data-digit="0" class="button button--number button--zero">0</button>
                    <button data-digit="." class="button button--number">.</button>
                    <button data-action="equals" class="button button--equals">=</button>
                    <button data-operator="+" class="button button--operator">+</button>
                </div>
            </div>
        </main>
        <script src="js/app.js"></script>
    </body>
</html>
