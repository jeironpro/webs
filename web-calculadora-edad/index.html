<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Calcula tu edad exacta en años, meses y días a partir de tu fecha de nacimiento."
        />
        <meta name="theme-color" content="#fafafa" />
        <title>Calculadora de edad</title>
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <main class="age-calculator">
            <header class="age-calculator__header">
                <h1 class="age-calculator__title">Calculadora de edad</h1>
                <p class="age-calculator__subtitle">
                    Descubre tu edad exacta en años, meses y días
                </p>
            </header>
            <form class="age-calculator__form" id="age-form" novalidate>
                <div class="age-calculator__field">
                    <label class="age-calculator__label" for="birth-date">
                        Fecha de nacimiento
                    </label>
                    <input
                        class="age-calculator__input"
                        id="birth-date"
                        name="birth-date"
                        type="date"
                        autocomplete="bday"
                        aria-describedby="form-error"
                        aria-invalid="false"
                        required
                    />
                    <p class="age-calculator__error" id="form-error" role="alert" hidden></p>
                </div>
                <button class="age-calculator__button" type="submit">Calcular edad</button>
            </form>
            <section class="age-calculator__result" aria-atomic="true" aria-live="polite">
                <div class="age-calculator__result-card" id="result-card" hidden>
                    <p class="age-calculator__result-text" id="age-text"></p>
                </div>
            </section>
        </main>
        <script type="module" src="js/app.js"></script>
    </body>
</html>
