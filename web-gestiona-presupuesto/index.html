<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión De Presupuesto</title>
    <link rel="icon" href="icon/presupuesto.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
    <main>
        <header class="contenedor-titulo">
            <h1>Gestión de Presupuesto</h1>
        </header>
        <section class="contenedor">
            <article class="contenedor-ingresos">
                <div class="contenedor-titulo">
                    <h1>Ingresos</h1>
                </div>
                <div class="ingresos">
                    <input type="number" id="ingresos" placeholder="Monto del ingreso"
                        aria-label="Ingresar monto de ingresos" />
                </div>
                <div class="boton">
                    <button onclick="agregarIngresos()">Agregar Ingresos</button>
                </div>
            </article>
            <article class="contenedor-gastos">
                <div class="contenedor-titulo">
                    <h1>Gastos</h1>
                </div>
                <div class="gastos">
                    <input type="number" id="gastos" placeholder="Monto del gasto"
                        aria-label="Ingresar monto de gastos" />
                </div>
                <div class="boton">
                    <button onclick="agregarGastos()">Agregar Gastos</button>
                </div>
            </article>
        </section>
        <section class="contenedor-balances">
            <div class="totalIngresos">
                <p>Ingresos Totales</p>
                <p id="totalIngresos">0</p>
            </div>
            <div class="totalGastos">
                <p>Gastos Totales</p>
                <p id="totalGastos">0</p>
            </div>
            <div class="balance">
                <p>Balance Neto</p>
                <p id="balance">0</p>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
