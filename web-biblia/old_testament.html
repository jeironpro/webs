<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antiguo testamento</title>
    <link rel="icon" type="image/svg+xml" href="icons/biblia.svg">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/books.css">
</head>
<body>
    <header class="testaments-header">
        <div class="links">
            <a href="index.html" aria-label="Inicio">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 11.5 12 4l9 7.5"/>
                    <path d="M5.5 10v9.5h13V10"/>
                </svg>
            </a>
        </div>
        <h1>Antiguo testamento</h1>
    </header>
    <main class="testament">
        <div class="books" id="books-ot"></div>
    </main>
    <footer>
        <p>&copy; Todos los derechos reservados <span id="year"></span> - JeironPro</p>
    </footer>
    <script>
        const slugify = (name) =>
            name
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/\s+/g, "");

        const oldTestamentSections = [
            { title: "Pentateuco", books: ["Génesis", "Éxodo", "Levítico", "Números", "Deuteronomio"] },
            { title: "Históricos", books: ["Josué", "Jueces", "Rut", "1 Samuel", "2 Samuel", "1 Reyes", "2 Reyes", "1 Crónicas", "2 Crónicas", "Esdras", "Nehemías", "Tobías", "Judit", "Ester", "1 Macabeos", "2 Macabeos"] },
            { title: "Poéticos y sapienciales", books: ["Job", "Salmos", "Proverbios", "Eclesiastés", "Cantar de los Cantares", "Sabiduría", "Eclesiástico"] },
            { title: "Proféticos", books: ["Isaías", "Jeremías", "Lamentaciones", "Baruc", "Ezequiel", "Daniel", "Oseas", "Joel", "Amós", "Abdías", "Jonás", "Miqueas", "Nahúm", "Habacuc", "Sofonías", "Ageo", "Zacarías", "Malaquías"] }
        ];

        const oldTestamentContainer = document.getElementById("books-ot");

        oldTestamentSections.forEach((section) => {
            const heading = document.createElement("h2");
            heading.className = "section-title";
            heading.textContent = section.title;
            oldTestamentContainer.appendChild(heading);

            section.books.forEach((name) => {
                const book = document.createElement("div");
                book.classList.add("book");
                const link = document.createElement("a");
                link.href = `html/old_testament/${slugify(name)}.html`;
                link.textContent = name;
                book.appendChild(link);
                oldTestamentContainer.appendChild(book);
            });
        });
    </script>
    <script>
        const yearFooter = document.getElementById("year");
        if (yearFooter) yearFooter.textContent = new Date().getFullYear();
    </script>
</body>
</html>
